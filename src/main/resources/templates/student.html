<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>
<body>
    <h1>Student List</h1>
    <table border="1">
        <thead>
          <tr>
            <td>ID</td>
            <td>Name</td>
            <td>Email</td>
            <td>PhoneNumber</td>
            <td>Action</td>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.phoneNumber}"></td>
            <td>
               <input value="View" type="button">
              <input value="Update" type="button">
              <input value="Delete" type="button">
            </td>
          </tr>
        </tbody>
    </table>
</body>
</html>
